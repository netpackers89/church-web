<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#35483e" />
    <meta name="description" content="Yeka Abado Mulu Wengel Church: worship, Bible study, fellowship, and community in Addis Ababa." />
    <link rel="icon" href="/favicon_io(3)/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io(3)/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io(3)/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io(3)/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon_io(3)/site.webmanifest" />
    <title>Yeka Abado Mulu Wengel Church</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('church_theme_pref');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = savedTheme === 'dark'
          || (savedTheme === 'system' && systemDark)
          ? 'dark'
          : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
